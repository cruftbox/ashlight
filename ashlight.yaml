# Ashlight: an ambient air quality lamp.
#
# Polls a PurpleAir PA-II on the local network every 2 minutes, applies the
# Barkjohn/EPA correction, computes AQI against the 2024 EPA breakpoints, and
# shows the result as a colour on a 16-LED WS2812B ring. No cloud services, no
# API keys, nothing outside the LAN.
#
# The pipeline, in order, because the order matters:
#
#   1. Average the two PM2.5 cf_1 channels from the sensor.
#   2. Correct with Barkjohn using the sensor's own humidity.
#   3. Smooth the CORRECTED CONCENTRATION over a 16 minute window.
#   4. Compute AQI from that smoothed concentration.
#   5. Map AQI to a colour on a continuous gradient.
#
# Steps 3 and 4 must not be swapped. The concentration-to-AQI mapping is
# piecewise linear, so the mean of two AQI values straddling a breakpoint is not
# the AQI of the mean concentration.
#
# Colour is a continuous gradient rather than six discrete steps. The pure EPA
# colour sits at the MIDPOINT of each category and blends toward the next one
# as AQI rises, so deep inside a category reads as that colour, and a boundary
# reads as a 50/50 mix. AQI 49 and AQI 51 therefore look nearly identical,
# which they should, because the air is nearly identical.
#
# That gradient is also what removes the need for category hysteresis. A
# continuous colour has no category to flip between, so the only thing that
# needs damping is the input, handled by the moving average in step 3.
#
# See README.md for wiring, build and configuration.

substitutions:
  # Not a secret, just site config. A private LAN address is harmless in a
  # published config, and keeping it here rather than in secrets.yaml means
  # the YAML stays readable.
  sensor_ip: "192.168.4.25"

  # Consecutive failed polls before the ring gives up and shows the offline
  # pattern. At a 2 minute interval, 10 is 20 minutes of nothing. Air quality
  # does not move fast enough for a stale 20 minute reading to mislead, and the
  # PurpleAir goes unreachable often enough that a lower threshold made the ring
  # flip into the offline pattern during ordinary operation.
  fail_threshold: "10"

  # Ring brightness, 0.0 to 1.0. Tune these rather than the lambdas.
  # Below about 0.04 the 8-bit channels get coarse and mixed hues start to
  # band, so the gradient degrades before the light does.
  bright_day: "0.45"
  bright_night: "0.06"

esphome:
  name: ashlight
  friendly_name: Ashlight
  on_boot:
    # Interval timers do not fire until one full period has elapsed, so without
    # this the sensors sit unknown for two minutes after every reboot.
    priority: -100
    then:
      # There is no reading yet, so show the offline state rather than black or
      # a default colour that could be read as a measurement.
      - light.turn_on:
          id: ring
          effect: "Sensor Offline"
          # sun.sun may not have arrived from Home Assistant this early in boot,
          # in which case the string is empty and this falls through to the dim
          # value. Erring dim at boot is the right way round.
          # Block scalar, because the ": " inside a C++ ternary parses as a YAML
          # mapping on a single line.
          brightness: !lambda |-
            return id(sun_state).state == "above_horizon" ? ${bright_day}f : ${bright_night}f;
      - delay: 15s
      - script.execute: poll_purpleair

esp32:
  board: nologo_esp32c3_super_mini   # sets variant esp32c3 automatically
  framework:
    type: esp-idf

# The C3 has no UART bridge chip. Serial logging rides the native
# USB Serial/JTAG peripheral, which is the same interface used to flash.
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # 802.11k/v. Both default to false on the ESP32.
  #
  # Without these the C3 is a sticky client: it holds whichever access point it
  # first associated with and only looks for a better one once its own signal
  # drops past roughly -84 dBm. In a mesh that can leave it sitting at -80 on a
  # distant node, bad enough to fail HTTP fetches but not bad enough to trigger
  # its own scan. These hand the decision to the network instead.
  #
  # Measured result here, so you can judge whether to keep them: on a three-unit
  # Eero 7 mesh, no steering event was observed in two hours at -77 to -81 dBm.
  # They did no harm and no good. Left in because the mechanism is right and
  # other access points may act on it.
  #
  # Know the tradeoff before keeping them: this is a swap, not an addition.
  # ESPHome disables its own post-connect roam scanning when either is set, on
  # the assumption the driver handles roaming natively. Remove both lines to get
  # the scan-based behaviour back, which does work and did rescue this device
  # once when it reached -84 dBm.
  enable_btm: true
  enable_rrm: true

  # ESPHome defaults this to "light" on the ESP32, which sleeps the radio
  # between beacons.
  #
  # Measured: average ping latency fell from 207 ms to 71 ms and minimum from
  # 98 ms to 19 ms. Frame loss did not change, so this does not rescue a link
  # that is failing from weak signal. Kept because the latency is a real gain
  # and the only cost is power, which does not matter on a mains-powered lamp.
  power_save_mode: none

  # If the WiFi join fails, this AP comes up instead. Its presence is the
  # signal that the firmware booted fine and only the network is wrong.
  ap:
    ssid: "Ashlight Fallback"
    password: !secret fallback_ap_password

captive_portal:

http_request:
  useragent: esphome/ashlight
  timeout: 10s

  # Required, and it must stay above the timeout above.
  #
  # ESP-IDF's HTTP client blocks the main loop for the duration of a request,
  # and the ESP32 task watchdog is 5s. http_request's own default timeout is
  # 4.5s precisely so it stays under that. Any timeout longer than 5s therefore
  # needs the watchdog raised to match, or a slow sensor panics the board and
  # reboots it. This raises the watchdog for the request only; ESPHome restores
  # the 5s default the moment the fetch returns.
  #
  # If you change `timeout`, change this too, and keep the margin.
  watchdog_timeout: 15s

globals:
  # The PA-II's onboard web server is slow and drops requests under no load:
  # measured 7.2s, timeout, 4.1s, 0.1s over four consecutive tries, and it can
  # refuse connections entirely for minutes while still answering ping. A missed
  # poll is normal operation, not a fault, and must not change what the lamp
  # shows. Hence the failure state waits for ${fail_threshold} misses in a row.
  - id: consecutive_failures
    type: int
    restore_value: no
    initial_value: '0'

# Home Assistant already knows the location, so we read sunrise/sunset from it
# rather than putting the house coordinates in a config that gets published.
text_sensor:
  - platform: homeassistant
    id: sun_state
    entity_id: sun.sun

script:
  # Every way a poll can fail funnels through here: transport error, bad HTTP
  # status, malformed body, and a well-formed body missing the fields we need.
  # Keeping the counter and the give-up decision in one place is what stops
  # those paths from drifting apart, which is easy to do by accident because
  # they live in three different callbacks.
  #
  # The behaviour being protected: the lamp must never hold a stale colour
  # indefinitely. A wrong colour that looks authoritative is worse than an
  # obvious "no data" pattern.
  - id: note_poll_failure
    then:
      - lambda: |-
          id(consecutive_failures)++;
          ESP_LOGW("ashlight", "PurpleAir poll failed (%d consecutive)",
                   id(consecutive_failures));
          if (id(consecutive_failures) >= ${fail_threshold}) {
            // Follow the same day/night schedule. A rotating pattern at
            // daytime output at 3am is worse than the reading it replaced.
            float bright = (id(sun_state).state == "above_horizon") ? ${bright_day}f : ${bright_night}f;
            auto call = id(ring).turn_on();
            call.set_effect("Sensor Offline");
            call.set_brightness(bright);
            call.perform();
          }

  # Shared by the boot automation and the 2 minute interval so the request is
  # defined once.
  - id: poll_purpleair
    then:
      - http_request.get:
          url: http://${sensor_ip}/json
          capture_response: true

          # The measured payload is 1285 bytes and the default cap is 1kB.
          # Leaving it at the default truncates the body, which then fails as
          # a JSON parse error rather than as an obvious size error.
          max_response_buffer_size: 4kB

          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    ESP_LOGW("ashlight", "PurpleAir returned HTTP %d", response->status_code);
                    id(note_poll_failure).execute();
                    return;
                  }
                  // parse_json returns false when the body is malformed or
                  // overflowed the buffer, and otherwise returns whatever the
                  // callback returns. The callback returns false when the body
                  // parsed but did not carry the fields we need. A 200 with an
                  // unusable payload is a failed poll, not a successful one.
                  if (!json::parse_json(body, [](JsonObject root) -> bool {
                    // Field naming in this payload is inconsistent and it will
                    // bite you: particle fields use underscores (pm2_5_cf_1)
                    // while the sensor's own AQI fields use dots (pm2.5_aqi).
                    // Both are valid JSON keys. We read only the particle
                    // fields; see README.md for why the sensor's AQI is unused.
                    float a = NAN, b = NAN, rh = NAN;

                    if (root["pm2_5_cf_1"].is<float>()) {
                      a = root["pm2_5_cf_1"].as<float>();
                      id(pm25_cf1_a).publish_state(a);
                    }
                    if (root["pm2_5_cf_1_b"].is<float>()) {
                      b = root["pm2_5_cf_1_b"].as<float>();
                      id(pm25_cf1_b).publish_state(b);
                    }
                    if (root["current_humidity"].is<float>()) {
                      rh = root["current_humidity"].as<float>();
                      id(sensor_humidity).publish_state(rh);
                    }

                    // All three come from the same payload or we compute
                    // nothing, and a payload we cannot compute from is a failed
                    // poll rather than a quiet no-op.
                    if (std::isnan(a) || std::isnan(b) || std::isnan(rh)) {
                      ESP_LOGW("ashlight", "Payload missing pm2_5_cf_1, pm2_5_cf_1_b or current_humidity");
                      return false;
                    }

                    // Only now has the poll actually produced a reading.
                    id(consecutive_failures) = 0;

                    // Step 1: mean of the two cf_1 channels. Not atm.
                    float avg = (a + b) / 2.0f;

                    // Step 2: Barkjohn / EPA correction. RH is used raw. The
                    // enclosure bias is already baked into the fitted form, so
                    // offsetting humidity first makes the output worse.
                    float corrected = 0.524f * avg - 0.0862f * rh + 5.75f;
                    if (corrected < 0.0f)
                      corrected = 0.0f;
                    id(pm25_corrected).publish_state(corrected);

                    // The sensor carries a moving average filter, so .state is
                    // the smoothed value, not what we just handed it. Smooth the
                    // concentration and derive AQI from that, never the reverse:
                    // the concentration to AQI mapping is piecewise linear, so
                    // averaging AQI values across a breakpoint is not the same
                    // as the AQI of the averaged concentration.
                    float smoothed = id(pm25_corrected).state;
                    if (std::isnan(smoothed))
                      smoothed = corrected;

                    // Step 3: 2024 EPA breakpoints. Good/Moderate is 9.0, not
                    // the pre-2024 12.0.
                    static const float C_LO[6] = {0.0f,   9.1f,  35.5f,  55.5f, 125.5f, 225.5f};
                    static const float C_HI[6] = {9.0f,  35.4f,  55.4f, 125.4f, 225.4f, 325.4f};
                    static const float A_LO[6] = {0.0f,  51.0f, 101.0f, 151.0f, 201.0f, 301.0f};
                    static const float A_HI[6] = {50.0f, 100.0f, 150.0f, 200.0f, 300.0f, 500.0f};

                    // EPA truncates concentration to one decimal before lookup.
                    // That is what closes the gap between a band's top value and
                    // the next band's base, eg 9.0 to 9.1.
                    float c = floorf(smoothed * 10.0f) / 10.0f;

                    float aqi = 500.0f;  // above 325.4 the scale is capped
                    if (c <= C_HI[5]) {
                      for (int i = 0; i < 6; i++) {
                        if (c <= C_HI[i]) {
                          aqi = (A_HI[i] - A_LO[i]) / (C_HI[i] - C_LO[i])
                                * (c - C_LO[i]) + A_LO[i];
                          break;
                        }
                      }
                    }
                    float aqi_out = roundf(aqi);
                    id(aqi_corrected).publish_state(aqi_out);

                    // Gradient anchors. The pure EPA colour sits at the MIDPOINT
                    // of each category, so a category reads as itself when you
                    // are solidly inside it and a boundary reads as a 50/50 mix.
                    // Below the first anchor and above the last, the colour is
                    // flat rather than extrapolated, which is what the two guard
                    // branches below do.
                    static const float AQ[6] = {25.0f, 75.0f, 125.0f, 175.0f, 250.0f, 400.0f};
                    static const float CR[6] = {0.00f, 1.00f, 1.00f, 1.00f, 0.561f, 0.494f};
                    static const float CG[6] = {0.894f, 1.00f, 0.494f, 0.00f, 0.247f, 0.00f};
                    static const float CB[6] = {0.00f, 0.00f, 0.00f, 0.00f, 0.592f, 0.137f};

                    // Named outR/outG/outB because a and b are already the two
                    // channel readings in this scope.
                    float outR, outG, outB;
                    if (aqi <= AQ[0]) {
                      outR = CR[0]; outG = CG[0]; outB = CB[0];
                    } else if (aqi >= AQ[5]) {
                      outR = CR[5]; outG = CG[5]; outB = CB[5];
                    } else {
                      int k = 0;
                      while (k < 5 && aqi > AQ[k + 1])
                        k++;
                      float t = (aqi - AQ[k]) / (AQ[k + 1] - AQ[k]);
                      outR = CR[k] + t * (CR[k + 1] - CR[k]);
                      outG = CG[k] + t * (CG[k + 1] - CG[k]);
                      outB = CB[k] + t * (CB[k + 1] - CB[k]);
                    }

                    // Sixteen LEDs at full output is unpleasant at night. The
                    // sun state comes from Home Assistant, so no coordinates
                    // live in this file. If HA has not sent it yet the string is
                    // empty, which falls through to the dim value.
                    float bright = (id(sun_state).state == "above_horizon") ? ${bright_day}f : ${bright_night}f;

                    ESP_LOGI("ashlight", "AQI %.0f  corrected %.2f  smoothed %.2f  rgb %.2f/%.2f/%.2f  bright %.2f",
                             aqi_out, corrected, smoothed, outR, outG, outB, bright);

                    // Two calls, deliberately. ESPHome discards a transition on
                    // any light call that also carries an effect, so clearing
                    // the offline effect and fading to the new colour cannot be
                    // combined. Merging them back into one call compiles fine
                    // and silently loses the fade.
                    auto stop = id(ring).turn_on();
                    stop.set_effect("None");
                    stop.perform();

                    auto call = id(ring).turn_on();
                    call.set_rgb(outR, outG, outB);
                    call.set_brightness(bright);
                    call.set_transition_length(3000);
                    call.perform();
                    return true;
                  })) {
                    id(note_poll_failure).execute();
                  }
          on_error:
            then:
              # http_request already logs the underlying reason, eg
              # ESP_ERR_HTTP_CONNECT, so there is nothing to add here.
              - lambda: |-
                  id(note_poll_failure).execute();

interval:
  # 2 minutes matches the sensor's own averaging window. Faster gains nothing.
  - interval: 2min
    then:
      - script.execute: poll_purpleair

sensor:
  - platform: wifi_signal
    name: "RSSI"
    update_interval: 60s

  # Published from the JSON lambda, never self-polled, hence update_interval
  # never. Channels stay separate so drift between them is visible: see the
  # channel A note in PLAN.md.
  - platform: template
    name: "PM2.5 CF1 Channel A"
    id: pm25_cf1_a
    unit_of_measurement: "µg/m³"
    accuracy_decimals: 2
    device_class: pm25
    state_class: measurement
    update_interval: never

  - platform: template
    name: "PM2.5 CF1 Channel B"
    id: pm25_cf1_b
    unit_of_measurement: "µg/m³"
    accuracy_decimals: 2
    device_class: pm25
    state_class: measurement
    update_interval: never

  - platform: template
    name: "Sensor Humidity"
    id: sensor_humidity
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: humidity
    state_class: measurement
    update_interval: never

  # Output of step 2, published in its own right so the correction is visible
  # and debuggable rather than buried inside the AQI number.
  - platform: template
    name: "PM2.5 Corrected"
    id: pm25_corrected
    unit_of_measurement: "µg/m³"
    accuracy_decimals: 2
    device_class: pm25
    state_class: measurement
    update_interval: never
    filters:
      # 8 samples at one poll every 2 minutes is a 16 minute window, inside the
      # 15 to 30 minutes the plan calls for. This is the only damping in the
      # system: the colour gradient is continuous, so there is no category to
      # apply hysteresis to.
      - sliding_window_moving_average:
          window_size: 8
          send_every: 1

  # This is ours, computed from the corrected concentration. It is deliberately
  # not the sensor's own pm2.5_aqi, which is uncorrected and uses pre-2024
  # breakpoints. Expect ours to read lower.
  - platform: template
    name: "AQI"
    id: aqi_corrected
    unit_of_measurement: "AQI"
    accuracy_decimals: 0
    device_class: aqi
    state_class: measurement
    update_interval: never

# The C3 has RMT hardware, so esp32_rmt_led_strip is the correct platform.
# neopixelbus and fastled_clockless are not the right choice here.
# rmt_symbols defaults to 96 on the C3, which is fine for 16 pixels.
light:
  - platform: esp32_rmt_led_strip
    name: "Ring"
    id: ring
    pin: GPIO3
    num_leds: 16
    chipset: WS2812        # WS2812B uses the same timings
    rgb_order: GRB         # WS2812B is green-red-blue on the wire
    restore_mode: ALWAYS_OFF

    # ESPHome defaults this to 2.8, which raises each channel to the power 2.8
    # before output. That smooths brightness ramps but it distorts hue, and it
    # does the most damage exactly where this project lives, in the blended
    # middles of the gradient. At AQI 52 the intended R=0.559 became R=0.196 and
    # a yellow-green rendered as near-pure green. Worse, AQI 125 rendered as
    # #FF2300 instead of #FF7D00, showing a full category redder than the air.
    # Driving the channels linearly keeps the mixed hues correct.
    gamma_correct: 1.0

    effects:
      # Shown from boot until the first successful poll, and again after
      # ${fail_threshold} consecutive failed polls.
      #
      # Three hard-edged R/G/B segments rotating around the ring. This does
      # sweep through green and red, which do carry meaning on the AQI scale,
      # so it bends the "no colour that means something" rule in the plan. It
      # still cannot be misread as a valid reading: it moves, it shows three
      # colours at once, and blue appears nowhere in the AQI palette. Motion is
      # the cue that matters. It also distinguishes "no data" from "unplugged",
      # which plain off would not.
      #
      # ~2.4s per revolution. Slow on purpose: this is an ambient object and a
      # fast chase reads as an alarm.
      - addressable_lambda:
          name: "Sensor Offline"
          update_interval: 150ms
          lambda: |-
            static int offset = 0;
            const int n = it.size();
            for (int i = 0; i < n; i++) {
              int seg = (((i + offset) % n) * 3) / n;
              if (seg == 0)      it[i] = Color(255, 0, 0);
              else if (seg == 1) it[i] = Color(0, 255, 0);
              else               it[i] = Color(0, 0, 255);
            }
            offset = (offset + 1) % n;

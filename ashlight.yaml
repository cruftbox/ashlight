# Ashlight - Phase 4: the math.
# Phases 1 to 3 plus the Barkjohn correction and 2024 EPA breakpoints, giving
# a corrected PM2.5 sensor and our own AQI sensor. Still no color changes, no
# hysteresis, and no brightness schedule. Those are Phase 5. The light block is
# unchanged from Phase 2 and is still driven only by hand from Home Assistant.

substitutions:
  # Not a secret, just site config. A private LAN address is harmless in a
  # published config, and keeping it here rather than in secrets.yaml means
  # the YAML stays readable.
  sensor_ip: "192.168.4.25"

esphome:
  name: ashlight
  friendly_name: Ashlight
  on_boot:
    # Interval timers do not fire until one full period has elapsed, so without
    # this the sensors sit unknown for two minutes after every reboot.
    priority: -100
    then:
      - delay: 15s
      - script.execute: poll_purpleair

esp32:
  board: nologo_esp32c3_super_mini   # sets variant esp32c3 automatically
  framework:
    type: esp-idf

# The C3 has no UART bridge chip. Serial logging rides the native
# USB Serial/JTAG peripheral, which is the same interface used to flash.
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # If the WiFi join fails, this AP comes up instead. Its presence is the
  # signal that the firmware booted fine and only the network is wrong.
  ap:
    ssid: "Ashlight Fallback"
    password: !secret fallback_ap_password

captive_portal:

http_request:
  useragent: esphome/ashlight
  timeout: 10s

script:
  # Shared by the boot automation and the 2 minute interval so the request is
  # defined once.
  - id: poll_purpleair
    then:
      - http_request.get:
          url: http://${sensor_ip}/json
          capture_response: true

          # The measured payload is 1285 bytes and the default cap is 1kB.
          # Leaving it at the default truncates the body, which then fails as
          # a JSON parse error rather than as an obvious size error.
          max_response_buffer_size: 4kB

          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    ESP_LOGW("ashlight", "PurpleAir returned HTTP %d", response->status_code);
                    return;
                  }
                  json::parse_json(body, [](JsonObject root) -> bool {
                    // Particle fields use underscores. The AQI fields the plan
                    // tells us to ignore use dots. Both are valid JSON keys.
                    float a = NAN, b = NAN, rh = NAN;

                    if (root["pm2_5_cf_1"].is<float>()) {
                      a = root["pm2_5_cf_1"].as<float>();
                      id(pm25_cf1_a).publish_state(a);
                    }
                    if (root["pm2_5_cf_1_b"].is<float>()) {
                      b = root["pm2_5_cf_1_b"].as<float>();
                      id(pm25_cf1_b).publish_state(b);
                    }
                    if (root["current_humidity"].is<float>()) {
                      rh = root["current_humidity"].as<float>();
                      id(sensor_humidity).publish_state(rh);
                    }

                    // All three come from the same payload or we compute nothing.
                    if (std::isnan(a) || std::isnan(b) || std::isnan(rh))
                      return true;

                    // Step 1: mean of the two cf_1 channels. Not atm.
                    float avg = (a + b) / 2.0f;

                    // Step 2: Barkjohn / EPA correction. RH is used raw. The
                    // enclosure bias is already baked into the fitted form, so
                    // offsetting humidity first makes the output worse.
                    float corrected = 0.524f * avg - 0.0862f * rh + 5.75f;
                    if (corrected < 0.0f)
                      corrected = 0.0f;
                    id(pm25_corrected).publish_state(corrected);

                    // Step 3: 2024 EPA breakpoints. Good/Moderate is 9.0, not
                    // the pre-2024 12.0.
                    static const float C_LO[6] = {0.0f,   9.1f,  35.5f,  55.5f, 125.5f, 225.5f};
                    static const float C_HI[6] = {9.0f,  35.4f,  55.4f, 125.4f, 225.4f, 325.4f};
                    static const float A_LO[6] = {0.0f,  51.0f, 101.0f, 151.0f, 201.0f, 301.0f};
                    static const float A_HI[6] = {50.0f, 100.0f, 150.0f, 200.0f, 300.0f, 500.0f};

                    // EPA truncates concentration to one decimal before lookup.
                    // That is what closes the gap between a band's top value and
                    // the next band's base, eg 9.0 to 9.1.
                    float c = floorf(corrected * 10.0f) / 10.0f;

                    float aqi = 500.0f;  // above 325.4 the scale is capped
                    if (c <= C_HI[5]) {
                      for (int i = 0; i < 6; i++) {
                        if (c <= C_HI[i]) {
                          aqi = (A_HI[i] - A_LO[i]) / (C_HI[i] - C_LO[i])
                                * (c - C_LO[i]) + A_LO[i];
                          break;
                        }
                      }
                    }
                    id(aqi_corrected).publish_state(roundf(aqi));
                    return true;
                  });
          on_error:
            then:
              - lambda: |-
                  ESP_LOGW("ashlight", "PurpleAir fetch failed, sensor unreachable");

interval:
  # 2 minutes matches the sensor's own averaging window. Faster gains nothing.
  - interval: 2min
    then:
      - script.execute: poll_purpleair

sensor:
  - platform: wifi_signal
    name: "RSSI"
    update_interval: 60s

  # Published from the JSON lambda, never self-polled, hence update_interval
  # never. Channels stay separate so drift between them is visible: see the
  # channel A note in PLAN.md.
  - platform: template
    name: "PM2.5 CF1 Channel A"
    id: pm25_cf1_a
    unit_of_measurement: "µg/m³"
    accuracy_decimals: 2
    device_class: pm25
    state_class: measurement
    update_interval: never

  - platform: template
    name: "PM2.5 CF1 Channel B"
    id: pm25_cf1_b
    unit_of_measurement: "µg/m³"
    accuracy_decimals: 2
    device_class: pm25
    state_class: measurement
    update_interval: never

  - platform: template
    name: "Sensor Humidity"
    id: sensor_humidity
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: humidity
    state_class: measurement
    update_interval: never

  # Output of step 2, published in its own right so the correction is visible
  # and debuggable rather than buried inside the AQI number.
  - platform: template
    name: "PM2.5 Corrected"
    id: pm25_corrected
    unit_of_measurement: "µg/m³"
    accuracy_decimals: 2
    device_class: pm25
    state_class: measurement
    update_interval: never

  # This is ours, computed from the corrected concentration. It is deliberately
  # not the sensor's own pm2.5_aqi, which is uncorrected and uses pre-2024
  # breakpoints. Expect ours to read lower.
  - platform: template
    name: "AQI"
    id: aqi_corrected
    unit_of_measurement: "AQI"
    accuracy_decimals: 0
    device_class: aqi
    state_class: measurement
    update_interval: never

# The C3 has RMT hardware, so esp32_rmt_led_strip is the correct platform.
# neopixelbus and fastled_clockless are not the right choice here.
# rmt_symbols defaults to 96 on the C3, which is fine for 16 pixels.
light:
  - platform: esp32_rmt_led_strip
    name: "Ring"
    id: ring
    pin: GPIO3
    num_leds: 16
    chipset: WS2812        # WS2812B uses the same timings
    rgb_order: GRB         # WS2812B is green-red-blue on the wire
    restore_mode: ALWAYS_OFF

# Ashlight - Phase 2: LED proof of concept.
# Phase 1 (WiFi, api, ota, fallback AP, RSSI) plus a light block driven from
# the Home Assistant color picker. Ring on clip leads: no resistor, no
# capacitor, short wires, low brightness.
# Do not add the HTTP poll or any AQI math here. That is Phase 3.

esphome:
  name: ashlight
  friendly_name: Ashlight

esp32:
  board: nologo_esp32c3_super_mini   # sets variant esp32c3 automatically
  framework:
    type: esp-idf

# The C3 has no UART bridge chip. Serial logging rides the native
# USB Serial/JTAG peripheral, which is the same interface used to flash.
# This is the default for the C3 on ESPHome 2026.3.x, set explicitly so a
# different add-on version cannot change it underneath us.
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # If the WiFi join fails, this AP comes up instead. Its presence is the
  # signal that the firmware booted fine and only the network is wrong.
  ap:
    ssid: "Ashlight Fallback"
    password: !secret fallback_ap_password

captive_portal:

sensor:
  - platform: wifi_signal
    name: "RSSI"
    update_interval: 60s

# The C3 has RMT hardware, so esp32_rmt_led_strip is the correct platform.
# neopixelbus and fastled_clockless are not the right choice here.
# rmt_symbols defaults to 96 on the C3, which is fine for 16 pixels.
light:
  - platform: esp32_rmt_led_strip
    name: "Ring"
    id: ring
    pin: GPIO3
    num_leds: 16
    chipset: WS2812        # WS2812B uses the same timings
    rgb_order: GRB         # WS2812B is green-red-blue on the wire
    restore_mode: ALWAYS_OFF

    # Demo effects. Not part of the AQI behavior, safe to strip before Phase 5.
    effects:
      # width matches num_leds so one full color wheel wraps the ring exactly
      # once. The default of 50 would show only a third of the spectrum.
      - addressable_rainbow:
          name: "Rainbow Rotate"
          speed: 10
          width: 16

      # Three hard-edged R/G/B segments chasing around the ring.
      - addressable_lambda:
          name: "RGB Segments"
          update_interval: 80ms
          lambda: |-
            static int offset = 0;
            const int n = it.size();
            for (int i = 0; i < n; i++) {
              int seg = (((i + offset) % n) * 3) / n;
              if (seg == 0)      it[i] = Color(255, 0, 0);
              else if (seg == 1) it[i] = Color(0, 255, 0);
              else               it[i] = Color(0, 0, 255);
            }
            offset = (offset + 1) % n;
